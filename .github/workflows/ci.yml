name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v2
        with:
          python-version: "3.12"
          enable-cache: true
          cache-local-path: ~/.cache/uv
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint
        run: uv run ruff check src/ tests/

      - name: Check formatting
        run: uv run black --check src/ tests/

      - name: Run unit tests
        run: uv run python -m pytest

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/chronicler/

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v2
        with:
          python-version: "3.12"
          enable-cache: true
          cache-local-path: ~/.cache/uv
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --dev

      - name: Build package
        run: uv build

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      # Before the first production release:
      # 1. Configure trusted publishers for this repo/workflow on both TestPyPI and PyPI.
      # 2. Temporarily add `repository-url: https://test.pypi.org/legacy/` below.
      # 3. Push a pre-release tag to verify the publish flow against TestPyPI.

