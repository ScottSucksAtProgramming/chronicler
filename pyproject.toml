[project]
name = "chronicler"
version = "1.0.0"
description = "Local-first CLI for turning tabletop RPG session exports into an Obsidian campaign vault"
authors = [
    { name = "Scott Kostolni", email = "ScottKostolni+github@gmail.com" },
]
readme = "README.md"
keywords = [
    "dnd",
    "obsidian",
    "tabletop-rpg",
    "campaign-notes",
    "ai-agent",
    "llm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment :: Role-Playing",
]
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "typer>=0.12",
    "rich>=13.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pydantic-settings>=2.13.1",
    "platformdirs>=4.0",
    "pdfplumber>=0.11.9",
    "thefuzz>=0.22.1",
    "textual>=8.2.1",
    "tomli-w>=1.0",
    "chromadb>=1.5.5",
]

[project.urls]
Homepage = "https://github.com/ScottSucksAtProgramming/chronicler"
Repository = "https://github.com/ScottSucksAtProgramming/chronicler"
Issues = "https://github.com/ScottSucksAtProgramming/chronicler/issues"

[project.scripts]
chronicler = "chronicler.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chronicler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not integration'"
markers = [
    "integration: marks tests that require external services (run with '-m integration')",
]

[tool.black]
target-version = ["py312"]

[dependency-groups]
dev = [
    "black>=25.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.11",
]
