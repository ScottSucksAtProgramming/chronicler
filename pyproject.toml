[project]
name = "chronicler"
version = "0.1.0"
description = "Chronicler — AI agent for tabletop campaign note management"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "typer>=0.12",
    "rich>=13.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pydantic-settings>=2.13.1",
    "pdfplumber>=0.11.9",
    "thefuzz>=0.22.1",
    "textual>=8.2.1",
    "chromadb>=1.5.5",
]

[project.scripts]
chronicler = "chronicler.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chronicler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not integration'"
markers = [
    "integration: marks tests that require external services (run with '-m integration')",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
